# Nginx INTERNO del contenedor frontend de GymboGest (no confundir con Nginx
# Proxy Manager, que es el portero de todo el VPS y gestiona el HTTPS).
#
# Sirve la SPA compilada y reenvia /api al backend Node. Mismo patron que Jobia.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Con `resolver` + variable, Nginx resuelve el nombre
    # del backend en cada request: asi el frontend arranca aunque el backend aun
    # no este listo.
    resolver 127.0.0.11 valid=10s;

    # El backend monta sus rutas bajo /api/*. Se reenvia el URI COMPLETO (con el
    # /api incluido): por eso proxy_pass usa $request_uri sin barra final.
    location /api/ {
        set $upstream http://backend:3001;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas de la SPA -> index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index.html NUNCA se cachea: es el que apunta a los assets con hash. Si
    # el navegador lo cachea, tras un deploy sigue pidiendo los assets VIEJOS y
    # el usuario ve una version desactualizada. Con no-cache, revalida el HTML en
    # cada visita y siempre recibe la referencia al asset mas nuevo.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # Los assets llevan hash en el nombre (index-Abc123.js): su contenido nunca
    # cambia, asi que cachearlos a 1 ano es seguro y rapido.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
